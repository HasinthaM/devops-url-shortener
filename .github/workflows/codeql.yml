name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC, catches newly published query packs

permissions:
  contents: read

jobs:
  analyze:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # TEMPORARY: code scanning is not enabled in repo settings, so the SARIF upload is rejected.
      # Results are saved as a downloadable artifact instead. Once code scanning is enabled
      # (Settings -> Code security), remove `upload: never` and `output` and delete the artifact step.
      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql-js-ts
          upload: never
          output: codeql-results

      - name: Save CodeQL results
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: codeql-results/
          if-no-files-found: warn
          retention-days: 14
